<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landary</title>
  <meta name="description" content="Reusable landing page section library." />
  <style>
    :root {
      --bg: #0b0b0c;
      --surface: #141416;
      --text: #f5f5f5;
      --muted: #9b9ba1;
      --line: #2a2a2e;
      --accent: #ffffff;
      --container: 1180px;
      --space: clamp(24px, 4vw, 64px);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(calc(100% - 32px), var(--container));
      margin-inline: auto;
    }

    .hero {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding-block: var(--space);
    }

    .hero__inner {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .8fr);
      gap: clamp(40px, 7vw, 96px);
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(56px, 8vw, 112px);
      line-height: .92;
      letter-spacing: -.06em;
    }

    .lead {
      max-width: 560px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      transition: transform 180ms ease, background-color 180ms ease, color 180ms ease;
    }

    .button--primary {
      background: var(--accent);
      color: #0b0b0c;
      border-color: var(--accent);
    }

    .button:hover { transform: translateY(-2px); }

    .preview {
      position: relative;
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(145deg, #1f1f23, #0f0f11 70%);
    }

    .preview::before,
    .preview::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      background: rgba(255,255,255,.025);
      backdrop-filter: blur(8px);
    }

    .preview::before {
      inset: 56px 48px 180px;
    }

    .preview::after {
      inset: auto 48px 56px 48px;
      height: 88px;
    }

    .preview__label {
      position: absolute;
      left: 72px;
      top: 82px;
      z-index: 1;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 800px) {
      .hero { min-height: auto; padding-block: 72px; }
      .hero__inner { grid-template-columns: 1fr; }
      h1 { max-width: 9ch; }
      .preview { min-height: 360px; }
      .preview::before { inset: 36px 28px 140px; }
      .preview::after { left: 28px; right: 28px; bottom: 36px; }
      .preview__label { left: 48px; top: 58px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="container hero__inner">
        <div>
          <p class="eyebrow">Landing + Library</p>
          <h1>Landary</h1>
          <p class="lead">A clean, reusable section library for building landing pages with consistent structure, responsive behavior, and controlled motion.</p>
          <div class="actions">
            <a class="button button--primary" href="#library">Start building</a>
            <a class="button" href="https://github.com/dejanxmkd/landary">View repository</a>
          </div>
        </div>
        <div class="preview" id="library" aria-label="Landary section preview placeholder">
          <span class="preview__label">Hero 01 · Split</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
