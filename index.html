<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Landary — Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;500;600;700&family=Material+Icons&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202608141750">
  <style>@font-face{font-family:'TAY Rosemary';src:url('./assets/fonts/TAYRosemary.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}</style>
</head>
<body>
  <main class="landing">
    <section class="section section--hero" aria-labelledby="hero-title">
      <div class="intro-copy">
        <h1 id="hero-title" class="display-title">
          <span>Made for the rituals</span>
          <span>we return to every day.</span>
        </h1>
      </div>
    </section>

    <section class="section section--story" aria-labelledby="story-title">
      <div class="intro-copy">
        <h2 id="story-title" class="display-title">
          <span>And it all begins</span>
          <span>with coffee.</span>
        </h2>
      </div>
    </section>

    <section class="coffee-scroll" id="coffee-scroll" aria-label="Coffee collection">
      <div class="coffee-sticky">
        <div class="coffee-track" id="coffee-track"></div>
      </div>
    </section>
  </main>

  <script src="app.js?v=202608141750"></script>
  <script>
    (()=>{
      const carousels=[...document.querySelectorAll('[data-image-carousel]')];
      carousels.forEach(carousel=>{
        const slide=carousel.closest('.coffee-slide');
        const viewport=carousel.querySelector('.image-viewport');
        const prev=carousel.querySelector('[data-image-prev]');
        const next=carousel.querySelector('[data-image-next]');
        if(!slide||!viewport)return;

        const goTo=imageIndex=>{
          const dot=slide.querySelector(`[data-image-dot="${imageIndex}"]`);
          dot?.click();
        };
        const currentIndex=()=>slide.querySelector('[data-image-dot].is-active')?.dataset.imageDot==='1'?1:0;

        prev?.addEventListener('click',()=>{
          if(slide.classList.contains('is-detail'))return;
          goTo(currentIndex()===0?1:0);
        });
        next?.addEventListener('click',()=>{
          if(slide.classList.contains('is-detail'))return;
          goTo(currentIndex()===1?0:1);
        });

        let startX=0,startY=0,tracking=false,pointerId=null;
        viewport.addEventListener('pointerdown',event=>{
          if(slide.classList.contains('is-detail'))return;
          if(event.button!==undefined&&event.button!==0)return;
          tracking=true;
          pointerId=event.pointerId;
          startX=event.clientX;
          startY=event.clientY;
          viewport.setPointerCapture?.(event.pointerId);
        });
        viewport.addEventListener('pointerup',event=>{
          if(slide.classList.contains('is-detail')||!tracking||event.pointerId!==pointerId)return;
          tracking=false;
          pointerId=null;
          const dx=event.clientX-startX;
          const dy=event.clientY-startY;
          if(Math.abs(dx)>46&&Math.abs(dx)>Math.abs(dy)*1.25)goTo(dx<0?1:0);
        });
        viewport.addEventListener('pointercancel',()=>{tracking=false;pointerId=null});
      });
    })();
  </script>
</body>
</html>
