<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landary — Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="./assets/giannos-brazil-roast-ground-beans.webp">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="cinematic-scroll">
  <div class="stage">
    <section class="layer hero" aria-labelledby="hero-title">
      <div class="hero__content">
        <h1 id="hero-title" class="hero__title intro intro-1"><span>Crafted Coffee for</span><span>Everyday Rituals</span></h1>
        <p class="hero__subtitle intro intro-2">Thoughtfully roasted coffee with rich character, balanced flavor, and quality you can taste in every cup.</p>
        <a class="hero__button intro intro-3" href="#">Shop Coffee</a>
      </div>
    </section>

    <section class="layer story" aria-labelledby="story-title">
      <div class="story__copy">
        <h2 id="story-title" class="story__title"><span>Good coffee doesn’t rush you.</span><span>It makes you stay a little longer.</span></h2>
      </div>

      <div class="product-layout" aria-hidden="true">
        <div></div><div></div>
      </div>

      <figure class="product">
        <img src="./assets/giannos-brazil-roast-ground-beans.webp" alt="Giannos Brazil Roast Ground Beans coffee bag" decoding="async" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/dejanxmkd/landary/main/assets/giannos-brazil-roast-ground-beans.webp'">
      </figure>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
