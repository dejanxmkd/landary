<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landary — Coffee Hero</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}:root{--bg:#000;--text:#fff;--muted:rgba(255,255,255,.66)}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Archivo',sans-serif}body{min-height:100svh;overflow-x:hidden}.hero{min-height:100svh;display:flex;align-items:flex-end;padding:clamp(28px,5vw,72px);background:#000}.hero__content{width:min(980px,100%);padding-bottom:clamp(24px,4vw,56px)}.reveal{opacity:0;filter:blur(18px);transform:translateY(44px);animation:cinematicReveal 1.35s cubic-bezier(.16,1,.3,1) forwards;will-change:transform,filter,opacity}.hero h1{margin:0;max-width:950px;font-size:clamp(56px,8vw,118px);line-height:.94;letter-spacing:-.055em;font-weight:700;animation-delay:.12s}.hero p{margin:28px 0 0;max-width:690px;color:var(--muted);font-size:clamp(17px,1.6vw,22px);line-height:1.55;font-weight:400;animation-delay:.34s}.hero a{display:inline-flex;align-items:center;justify-content:center;margin-top:34px;min-height:50px;padding:0 22px;border:1px solid #fff;background:#fff;color:#000;text-decoration:none;font-size:15px;font-weight:600;letter-spacing:-.01em;animation-delay:.56s;transition:background .2s ease,color .2s ease,transform .2s ease}.hero a:hover{background:#000;color:#fff;transform:translateY(-2px)}@keyframes cinematicReveal{0%{opacity:0;filter:blur(18px);transform:translateY(44px)}55%{opacity:.9}100%{opacity:1;filter:blur(0);transform:translateY(0)}}@media(max-width:700px){.hero{padding:24px}.hero__content{padding-bottom:20px}.hero h1{font-size:clamp(50px,15vw,76px)}.hero p{margin-top:22px;font-size:17px}.hero a{margin-top:28px}}@media(prefers-reduced-motion:reduce){.reveal{opacity:1;filter:none;transform:none;animation:none}.hero a{transition:none}}</style></head><body><main><section class="hero" aria-labelledby="hero-title"><div class="hero__content"><h1 id="hero-title" class="reveal">Crafted Coffee for Everyday Rituals</h1><p class="reveal">Thoughtfully roasted coffee with rich character, balanced flavor, and quality you can taste in every cup.</p><a class="reveal" href="#">Shop Coffee</a></div></section></main></body></html>
