<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Landary — Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;500;600;700&family=Material+Icons&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202608171409">
  <link rel="stylesheet" href="olive.css?v=202608171409">
</head>
<body>
  <main class="landing">
    <section class="section section--hero" aria-labelledby="hero-title">
      <div class="intro-copy">
        <h1 id="hero-title" class="display-title">
          <span>Made for the rituals</span>
          <span>we return to every day.</span>
        </h1>
      </div>
    </section>

    <section class="section section--story" aria-labelledby="story-title">
      <div class="intro-copy">
        <h2 id="story-title" class="display-title">
          <span>And it all begins</span>
          <span>with coffee.</span>
        </h2>
      </div>
    </section>

    <section class="coffee-scroll" id="coffee-scroll" aria-label="Coffee collection">
      <div class="coffee-sticky">
        <div class="coffee-track" id="coffee-track"></div>
      </div>
    </section>

    <section class="section section--olive-intro" aria-labelledby="olive-intro-title">
      <div class="intro-copy">
        <h2 id="olive-intro-title" class="display-title">
          <span>Made for the moments</span>
          <span>we gather around the table.</span>
        </h2>
      </div>
    </section>

    <section class="section section--olive-story" aria-labelledby="olive-story-title">
      <div class="intro-copy">
        <h2 id="olive-story-title" class="display-title">
          <span>And some begin</span>
          <span>with olive oil.</span>
        </h2>
      </div>
    </section>

    <section class="olive-scroll" id="olive-scroll" aria-label="Olive oil collection">
      <div class="olive-sticky">
        <div class="olive-track" id="olive-track"></div>
      </div>
    </section>
  </main>

  <script src="app.js?v=202608171409"></script>
  <script src="olive.js?v=202608171409"></script>
</body>
</html>
