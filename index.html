<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landary — Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<main>
<section class="scene hero" aria-labelledby="hero-title">
<div class="scene__content hero__content">
<h1 id="hero-title" class="hero__title cinematic delay-1">Crafted Coffee for Everyday Rituals</h1>
<p class="hero__subtitle cinematic delay-2">Thoughtfully roasted coffee with rich character, balanced flavor, and quality you can taste in every cup.</p>
<a class="hero__button cinematic delay-3" href="#">Shop Coffee</a>
</div>
</section>
<section class="scene statement" aria-labelledby="statement-title">
<div class="statement__grid">
<div class="statement__left" aria-hidden="true"></div>
<div class="statement__right" aria-hidden="true"></div>
<div class="statement__copy">
<h2 id="statement-title" class="statement__title"><span>Good coffee doesn’t rush you.</span><span>It makes you stay a little longer.</span></h2>
</div>
<figure class="statement__product"><img src="assets/giannos-brazil-roast-ground-beans.webp" alt="Giannos Brazil Roast Ground Beans coffee bag"></figure>
</div>
</section>
</main>
