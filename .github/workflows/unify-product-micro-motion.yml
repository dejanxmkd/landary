name: Unify product micro motion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-product-micro-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/unify_product_micro_motion.py
      - run: node --check app.js
      - run: node --check olive.js
      - run: |
          ! grep -q -- "--scene-blur" olive.js
          ! grep -q -- "--scene-image-y" olive.js
          ! grep -q -- "--scene-copy-y" olive.js
          ! grep -q -- "--scene-opacity" olive.css
          grep -q -- "--micro-opacity" app.js
          grep -q -- "--micro-opacity" olive.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js olive.js style.css olive.css index.html
          git commit -m "Use consistent micro motion for product sliders"
          git push origin HEAD:main
