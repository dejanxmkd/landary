name: Refine carousel scroll
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-carousel-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/refine_carousel_scroll.py
      - run: node --check app.js
      - run: grep -q "data-image-prev" app.js
      - run: grep -q "min-height:100svh;align-items:start" style.css
      - run: grep -q "background:rgba(255,255,255,.3)" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Refine product carousel and detail scroll height"
          git push origin HEAD:main
