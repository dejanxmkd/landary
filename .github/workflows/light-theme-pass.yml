name: Apply light cream theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/light-theme-pass.yml'

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cream and green theme
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          GREEN = '#3d5825'
          PAPER = '#fdf8ec'

          style_path = Path('style.css')
          css = style_path.read_text()

          css = css.replace("  --intro:#3d5825;", "  --intro:#3d5825;\n  --paper:#fdf8ec;")
          css = css.replace("  --intro-light:#fff;", "  --intro-light:#fdf8ec;")
          css = css.replace("  --text:#fff;", "  --text:#3d5825;")
          css = css.replace("  --muted:rgba(255,255,255,.72);", "  --muted:rgba(61,88,37,.68);")
          css = css.replace("html{background:var(--intro);scroll-behavior:auto}", "html{background:var(--paper);scroll-behavior:auto}")
          css = css.replace("body{margin:0;background:#fff;color:var(--text);font-family:var(--font-body);overflow-x:hidden}", "body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font-body);overflow-x:hidden}")
          css = css.replace("background:transparent", "background:var(--paper)")
          css = css.replace("color:#fff", "color:var(--intro)")
          css = css.replace("background:#fff", "background:var(--intro)")
          css = css.replace("rgba(255,255,255,.18)", "rgba(61,88,37,.18)")
          css = css.replace("rgba(255,255,255,.08)", "rgba(61,88,37,.06)")
          css = css.replace("rgba(255,255,255,.16)", "rgba(61,88,37,.12)")
          css = css.replace("rgba(255,255,255,.38)", "rgba(61,88,37,.38)")
          css = css.replace("rgba(255,255,255,.3)", "rgba(61,88,37,.28)")
          css = css.replace("rgba(255,255,255,.55)", "rgba(61,88,37,.55)")
          css = css.replace("rgba(255,255,255,.75)", "rgba(61,88,37,.72)")
          css = css.replace("rgba(255,255,255,.22)", "rgba(61,88,37,.22)")
          css = css.replace("rgba(255,255,255,.035)", "rgba(61,88,37,.035)")
          css = css.replace("rgba(255,255,255,.34)", "rgba(61,88,37,.34)")
          css = css.replace("rgba(255,255,255,.66)", "rgba(61,88,37,.66)")
          css = css.replace("rgba(255,255,255,.1)", "rgba(61,88,37,.1)")
          css = css.replace("rgba(255,255,255,.72)", "rgba(61,88,37,.68)")
          css = css.replace("rgba(255,255,255,.62)", "rgba(61,88,37,.62)")
          css = css.replace("rgba(255,255,255,.26)", "rgba(61,88,37,.26)")
          css = css.replace("rgba(255,255,255,.28)", "rgba(61,88,37,.28)")
          css = css.replace("background:var(--intro);color:var(--accent)", "background:var(--intro);color:var(--paper)")
          css = css.replace(".frequency-select option{color:#222}", ".frequency-select option{color:var(--intro);background:var(--paper)}")
          css = css.replace(".product-dot.is-active{background:var(--intro);", ".product-dot.is-active{background:var(--intro);")
          style_path.write_text(css)

          olive_path = Path('olive.css')
          olive = olive_path.read_text()
          olive = olive.replace('#A2A315', PAPER)
          olive = olive.replace('--olive-cream:#f3eedf', '--olive-cream:#3d5825')
          olive = olive.replace('rgba(243,238,223,.72)', 'rgba(61,88,37,.68)')
          olive = olive.replace('rgba(243,238,223,.75)', 'rgba(61,88,37,.72)')
          olive = olive.replace('rgba(243,238,223,.22)', 'rgba(61,88,37,.22)')
          olive = olive.replace('rgba(243,238,223,.62)', 'rgba(61,88,37,.62)')
          olive = olive.replace('rgba(243,238,223,.26)', 'rgba(61,88,37,.26)')
          olive = olive.replace('rgba(243,238,223,.28)', 'rgba(61,88,37,.28)')
          olive = olive.replace('rgba(243,238,223,.34)', 'rgba(61,88,37,.34)')
          olive = olive.replace('background:rgba(255,255,255,.035)', 'background:rgba(61,88,37,.035)')
          olive = olive.replace('background:rgba(255,255,255,.1)', 'background:rgba(61,88,37,.1)')
          olive = olive.replace('color:#fff', 'color:#3d5825')
          olive = olive.replace('border-color:rgba(243,238,223,.72)', 'border-color:rgba(61,88,37,.72)')
          olive = olive.replace('.olive-slide .add-cart{background:var(--olive-cream);color:#fdf8ec}', '.olive-slide .add-cart{background:#3d5825;color:#fdf8ec}')
          olive_path.write_text(olive)

          app_path = Path('app.js')
          app = app_path.read_text()
          app = re.sub(r"\n  const WHITE=\[255,255,255\];.*?\n  function renderHorizontal\(\)", "\n  function globalStops(){\n    const hero=document.querySelector('.section--hero');\n    const story=document.querySelector('.section--story');\n    const oliveIntro=document.querySelector('.section--olive-intro');\n    const oliveStory=document.querySelector('.section--olive-story');\n    const{start,distance}=sectionMetrics();\n    const coffeeStep=distance/(PRODUCTS.length-1);\n    const stops=[];\n    if(hero)stops.push({y:hero.offsetTop});\n    if(story)stops.push({y:story.offsetTop});\n    PRODUCTS.forEach((_,index)=>stops.push({y:start+coffeeStep*index}));\n    if(oliveIntro)stops.push({y:oliveIntro.offsetTop});\n    if(oliveStory)stops.push({y:oliveStory.offsetTop});\n    if(typeof window.__oliveSnapStops==='function')stops.push(...window.__oliveSnapStops().map(stop=>({y:stop.y})));\n    return stops.sort((a,b)=>a.y-b.y);\n  }\n\n  function renderHorizontal()", app, flags=re.S)
          app = app.replace("    renderBackground();\n", "")
          app = app.replace("renderHorizontal();renderBackground()", "renderHorizontal()")
          app_path.write_text(app)

          olive_js = Path('olive.js')
          oj = olive_js.read_text()
          oj = oj.replace("style=\"--accent:#A2A315\"", "style=\"--accent:#3d5825\"")
          oj = oj.replace("    const olive=[162,163,21];\n    return [{y:start,color:olive},{y:start+distance,color:olive}];", "    return [{y:start},{y:start+distance}];")
          olive_js.write_text(oj)

          index = Path('index.html')
          html = index.read_text()
          html = re.sub(r'style\.css\?v=\d+', 'style.css?v=202608171247', html)
          html = re.sub(r'olive\.css\?v=\d+', 'olive.css?v=202608171247', html)
          html = re.sub(r'app\.js\?v=\d+', 'app.js?v=202608171247', html)
          html = re.sub(r'olive\.js\?v=\d+', 'olive.js?v=202608171247', html)
          index.write_text(html)
          PY

          rm .github/workflows/light-theme-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css olive.css app.js olive.js index.html .github/workflows/light-theme-pass.yml
          git commit -m "Switch site to cream and green theme"
          git push
