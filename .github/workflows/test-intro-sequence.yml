name: Test intro sequence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-intro-sequence.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check site-shell.js
      - run: |
          grep -q "function moveLogo" site-shell.js
          grep -q "revealNavigation" site-shell.js
          grep -q "setTimeout(revealContent,navDuration)" site-shell.js
          grep -q "content-entering" site-shell.js
          grep -q "transform:translate3d(0,-100%,0)" site-shell.css
          grep -q "body.nav-entering .site-header" site-shell.css
          grep -q "body.content-entering .landing" site-shell.css
