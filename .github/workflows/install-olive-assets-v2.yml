name: Install olive oil assets v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-olive-assets-v2.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/install_olive_assets.py
      - run: node --check olive.js
      - run: test ! -f Giannos_Olive_Oil_4K_Clean_Transparent.zip
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use local 4K olive oil product images"
          git push origin HEAD:main
