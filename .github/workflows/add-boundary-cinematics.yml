name: Add boundary cinematics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-boundary-cinematics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_boundary_cinematics.py
      - run: node --check app.js
      - run: node --check olive.js
      - run: grep -q 'function updateBoundaryCinematics' app.js
      - run: grep -q 'coffee-scroll:not(.is-entry-cinematic-active)' style.css
      - run: grep -q 'olive-scroll:not(.is-entry-cinematic-active)' olive.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css olive.css index.html
          git commit -m "Add cinematic transitions into product sections"
          git push origin HEAD:main
