name: Add gallery edge gradients
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-gallery-edge-gradients.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_gallery_edge_gradients.py
      - run: grep -q 'image-carousel::before' style.css && grep -q 'olive-image-carousel::before' olive.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css olive.css index.html
          git commit -m "Add soft gallery edge gradients"
          git push origin HEAD:main
