name: Fix carousel arrows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-carousel-arrows.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_carousel_arrows.py
      - run: node --check app.js
      - run: grep -q "swipeSurface" app.js
      - run: grep -q "pointer-events:none" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Fix product carousel arrow interactions"
          git push origin HEAD:main
