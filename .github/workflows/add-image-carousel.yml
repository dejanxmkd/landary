name: Add image carousel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-image-carousel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_image_carousel.py
      - run: node --check app.js
      - run: grep -q "data-image-dot" app.js
      - run: grep -q "position:sticky;top:0;height:100svh" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Add sticky product image carousel"
          git push origin HEAD:main
