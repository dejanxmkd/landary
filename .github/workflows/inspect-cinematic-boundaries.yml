name: Inspect cinematic boundaries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cinematic-boundaries.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- APP TAIL ---'
          tail -n 160 app.js
          echo '--- CINEMATIC CSS ---'
          grep -n -E 'cinematic|intro-copy|micro-opacity|micro-scale' style.css || true
