name: Match Story Brazil transition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-story-brazil-transition.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/match_story_brazil_transition.py
      - run: node --check app.js
      - run: grep -q "translateY(12vh) scale(.985)" app.js
      - run: grep -q "1380ms cubic-bezier(.16,1,.3,1)" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Match Story to Brazil section transition"
          git push origin HEAD:main
