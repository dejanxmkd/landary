name: Fix close center target
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-close-center-target.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_close_center_target.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check olive.js
          node --check honey.js
      - name: Verify close target
        run: |
          test "$(grep -o "const available=innerHeight-header" app.js | wc -l)" -eq 1
          test "$(grep -o "const available=innerHeight-header" olive.js | wc -l)" -eq 1
          test "$(grep -o "const available=innerHeight-header" honey.js | wc -l)" -eq 1
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js olive.js honey.js
          git commit -m "Align close animation with final centered state"
          git push origin HEAD:main
