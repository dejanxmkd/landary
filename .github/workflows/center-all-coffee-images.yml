name: Center all coffee images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/center-all-coffee-images.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center all coffee product images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "product.style.transform=mobile?'translate(-50%,-62%) scale(.78)':'translate(calc(-50% - 25vw),calc(-50% + 8vh)) scale(1)';"
          new = "product.style.transform=mobile?'translate(-50%,-62%) scale(.78)':'translate(calc(-50% - 25vw),-50%) scale(1)';"
          if old not in s:
              raise SystemExit('Expected coffee positioning rule not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Center all coffee product images"
          git push origin HEAD:main
