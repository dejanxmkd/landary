name: Fix coffee full section swipe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-coffee-full-section-swipe.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_coffee_full_section_swipe.py
      - run: node --check app.js
      - run: grep -q "translateY(-100vh)" app.js
      - run: grep -q "translateY(100vh)" app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Swipe coffee products as full viewport sections"
          git push origin HEAD:main
