name: Sticky detail gallery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sticky-detail-gallery.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/sticky_detail_gallery.py
      - run: grep -q "position:sticky;top:0;height:100svh" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Make product image column sticky in details"
          git push origin HEAD:main
