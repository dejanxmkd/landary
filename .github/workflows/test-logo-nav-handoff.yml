name: Test logo nav handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-logo-nav-handoff.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check site-shell.js
      - run: |
          test "$(grep -o 'giannos-logo.svg' index.html | wc -l)" -eq 1
          grep -q 'data-nav-logo-target' index.html
          grep -q 'setTimeout(startNavigation,navDelay)' site-shell.js
          grep -q 'if(contentStarted||!logoDone||!navDone)return' site-shell.js
          grep -q '.site-loader.is-moving{z-index:1400;background:transparent' site-shell.css
