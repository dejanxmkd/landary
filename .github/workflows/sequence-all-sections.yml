name: Sequence all sections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sequence-all-sections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/sequence_all_sections.py
      - run: node --check app.js
      - run: node --check olive.js
      - run: grep -q 'function updateSectionSequence' app.js
      - run: grep -q 'is-sequence-active' style.css && grep -q 'is-sequence-active' olive.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css olive.css index.html
          git commit -m "Gate all section transitions sequentially"
          git push origin HEAD:main
