name: Enable normal carousel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-normal-carousel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/enable_normal_carousel.py
      - run: node --check app.js
      - run: grep -q "image-carousel:hover .carousel-arrow" style.css
      - run: grep -q "image-carousel:hover .product-dots" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Enable product carousel outside details"
          git push origin HEAD:main
