name: Process coffee product images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack and configure products
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, zipfile, shutil
          from pathlib import Path

          root=Path('.')
          assets=root/'assets'
          out=assets/'product_images'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)

          meta={
            'Giannos Brazil Roast': dict(slug='brazil',color='#4D6E48',description='A smooth, medium roast from Brazil with a naturally sweet body and soft notes of chocolate and caramel. Choose it whole bean for maximum freshness, or ground and ready for the way you brew every day.',flavor='Chocolate, caramel and naturally sweet body',roast='Medium',size='12 ounces'),
            'Giannos French Vanilla': dict(slug='french-vanilla',color='#1C6E95',description='Rich vanilla flavor, subtle nuttiness, and a creamy finish come together in a comforting medium roast made for easy mornings and familiar routines.',flavor='Rich vanilla, subtle nuttiness and creamy finish',roast='Medium',size='12 ounces'),
            'Giannos Colombian Roast': dict(slug='colombian',color='#563B66',description='A balanced medium roast with milk chocolate, hints of citrus, and a smooth finish. Choose whole bean or ground for a classic cup with brightness, body, and everyday drinkability.',flavor='Milk chocolate, citrus and a smooth finish',roast='Medium',size='12 ounces'),
            'Giannos Original Roast': dict(slug='original',color='#CF9A35',description='Rich aroma, layered flavor, and a full finish with just a hint of sweetness and no lingering aftertaste. A balanced medium roast made to feel familiar from the very first cup.',flavor='Rich aroma, layered flavor and a hint of sweetness',roast='Medium',size='12 ounces'),
            'Giannos Hazelnut': dict(slug='hazelnut',color='#634227',description='Earthy, sweet, and warmly roasted with a marbled hazelnut character that lingers into a long, smooth finish. A comforting medium roast made for slower cups and easy everyday brewing.',flavor='Earthy sweetness and warm roasted hazelnut',roast='Medium',size='12 ounces'),
            'Giannos Espresso Roast': dict(slug='espresso',color='#332016',description='Rich aroma, layered flavor, and a hint of sweetness carried into a full, rounded finish. A medium roast built for espresso with enough depth to stay bold and smooth in every shot.',flavor='Rich aroma, layered flavor and a rounded finish',roast='Medium',size='12 ounces'),
          }
          order=list(meta)
          products=[]

          def norm(name):
            name=name.lower().replace('&','and')
            name=re.sub(r'[^a-z0-9]+','-',name).strip('-')
            return name

          for name in order:
            z=assets/f'{name}.zip'
            if not z.exists():
              print('Missing ZIP:',z)
              continue
            cfg=meta[name]
            dest=out/cfg['slug']
            dest.mkdir(parents=True,exist_ok=True)
            files=[]
            with zipfile.ZipFile(z) as zh:
              for info in zh.infolist():
                p=Path(info.filename)
                low=info.filename.lower()
                if info.is_dir() or '__macosx' in low or p.name.startswith('._'):
                  continue
                if p.suffix.lower() not in {'.png','.jpg','.jpeg','.webp'}:
                  continue
                data=zh.read(info)
                filename=norm(p.stem)+p.suffix.lower()
                target=dest/filename
                target.write_bytes(data)
                files.append(target)

            variants={'Ground':[],'Whole Bean':[]}
            unknown=[]
            for f in files:
              low=f.name.lower()
              if 'ground' in low:
                variants['Ground'].append(f)
              elif 'whole' in low or 'bean' in low:
                variants['Whole Bean'].append(f)
              else:
                unknown.append(f)

            present={k:v for k,v in variants.items() if v}
            if unknown and not present:
              # Single unnamed format: keep one real option only.
              label='Whole Bean' if 'espresso' in cfg['slug'] else 'Ground'
              present[label]=unknown
            elif unknown and len(present)==1:
              next(iter(present.values())).extend(unknown)

            def rank(p):
              low=p.name.lower()
              return (0 if 'front' in low else 1 if 'back' in low else 2, low)

            images={}
            for label,arr in present.items():
              arr=sorted(arr,key=rank)
              images[label]=['./'+str(p).replace('\\','/') for p in arr]
            if not images:
              raise RuntimeError(f'No usable images found for {name}')

            default='Ground' if 'Ground' in images else next(iter(images))
            products.append({**cfg,'name':name,'defaultGrind':default,'images':images})
            print(name, '=>', {k:[Path(x).name for x in v] for k,v in images.items()})

          app=Path('app.js')
          text=app.read_text()
          js='  const PRODUCTS='+json.dumps(products,separators=(',',':'))+';'
          text=re.sub(r'  const PRODUCTS=\[.*?\n  \];',js,text,count=1,flags=re.S)

          helper="""  function grindOptionsTemplate(product){\n    const grinds=Object.keys(product.images);\n    if(!grinds.length)return '';\n    return `<section class=\"detail-block\"><div class=\"grind-options\" role=\"group\" aria-label=\"Coffee format\">${grinds.map(grind=>`<button class=\"choice-tab ${grind===product.defaultGrind?'is-selected':''}\" type=\"button\" data-grind=\"${grind}\">${grind}</button>`).join('')}</div></section>`;\n  }\n\n"""
          if 'function grindOptionsTemplate(product)' not in text:
            text=text.replace('  function slideTemplate(product,index){',helper+'  function slideTemplate(product,index){')

          old='<section class="detail-block"><div class="grind-options" role="group" aria-label="Coffee format"><button class="choice-tab ${product.defaultGrind===\'Ground\'?\'is-selected\':\'\'}" type="button" data-grind="Ground">Ground</button><button class="choice-tab ${product.defaultGrind===\'Whole Bean\'?\'is-selected\':\'\'}" type="button" data-grind="Whole Bean">Whole Bean</button></div></section>'
          text=text.replace(old,'${grindOptionsTemplate(product)}')
          app.write_text(text)

          for z in assets.glob('Giannos *.zip'):
            z.unlink()
          Path('.github/workflows/process-products.yml').unlink()
          PY

      - name: Commit processed product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize product images and sync coffee variants" || exit 0
          git push
