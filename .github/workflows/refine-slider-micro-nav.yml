name: Refine slider micro nav
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-slider-micro-nav.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/refine_slider_micro_nav.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check olive.js
          node --check honey.js
      - name: Interaction assertions
        run: |
          grep -q "1-d\*.12" app.js
          grep -q "1-d\*.018" olive.js
          grep -q "d\*14" honey.js
          grep -q '.coffee-slide.is-detail .edge-nav,.olive-slide.is-detail .edge-nav,.honey-slide.is-detail .edge-nav' style.css
          ! grep -q '.image-carousel:hover .edge-nav' style.css
          ! grep -q '.olive-image-carousel:hover .edge-nav' style.css
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js olive.js honey.js style.css index.html
          git commit -m "Refine slider micro interactions and detail navigation"
          git push origin HEAD:main
