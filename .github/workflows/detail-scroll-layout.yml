name: Detail scroll layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detail-scroll-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/detail_scroll_layout.py
      - run: grep -q "padding-top:180px" style.css
      - run: grep -q "position:relative;top:auto;height:100svh" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Make product details scroll as one layout"
          git push origin HEAD:main
