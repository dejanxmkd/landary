name: Refine edge nav
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-edge-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/refine_edge_nav.py
      - run: grep -q 'height:2px' style.css && grep -q 'edge-nav:hover i{width:48px}' style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git commit -m "Refine slider edge navigation"
          git push origin HEAD:main
