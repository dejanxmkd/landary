name: Fix image size and magnet scroll
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-image-size-and-magnet.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix_image_size_and_magnet.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check olive.js
          node --check honey.js
          node --check magnet.js
      - name: Image size assertions
        run: |
          grep -q 'width:min(28.8vw,432px)' style.css
          grep -q 'max-width:62.4%;max-height:62.4svh' olive.css
          grep -q 'max-width:60.8%;max-height:60.8svh' honey.css
          ! grep -q 'Normal product view: product imagery is 20% smaller' style.css
          ! grep -q 'Normal product view: product imagery is 20% smaller' olive.css
          ! grep -q 'Normal product view: product imagery is 20% smaller' honey.css
      - name: Magnet assertions
        run: |
          grep -q "#coffee-scroll" magnet.js
          grep -q "#olive-scroll" magnet.js
          grep -q "#honey-scroll" magnet.js
          grep -q "landing > .section" magnet.js
          grep -q "details-open" magnet.js
          grep -q "magnet.js?v=202608171545" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css olive.css honey.css magnet.js index.html
          git commit -m "Keep product images stable and restore global magnet scroll"
          git push origin HEAD:main
