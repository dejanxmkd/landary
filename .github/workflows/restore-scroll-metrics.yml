name: Restore scroll metrics
on:
  push:
    paths:
      - '.github/workflows/restore-scroll-metrics.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore shared scroll metrics
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          marker = "  let snapping=false;\n\n"
          fn = "  function sectionMetrics(){\n    const start=coffeeSection.offsetTop;\n    const distance=Math.max(coffeeSection.offsetHeight-innerHeight,1);\n    return {start,distance};\n  }\n\n"
          if 'function sectionMetrics()' not in s:
              if marker not in s:
                  raise SystemExit('Insertion marker not found')
              s = s.replace(marker, marker + fn, 1)
              p.write_text(s)
      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/restore-scroll-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/restore-scroll-metrics.yml
          git commit -m "Restore coffee scroll and shared snap metrics"
          git push