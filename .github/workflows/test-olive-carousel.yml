name: Test olive image carousel
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-olive-carousel.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check olive.js
      - run: grep -q "Front angled" olive.js && grep -q "data-olive-image-prev" olive.js && grep -q "data-olive-image-dot" olive.js
      - run: test -f assets/olive-oil/500ml/giannos-greek-extra-virgin-olive-oil-500ml-front.png && test -f assets/olive-oil/500ml/giannos-greek-extra-virgin-olive-oil-500ml-back.png
      - run: test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-front.png && test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-front-angled.png && test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-side.png && test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-back.png
