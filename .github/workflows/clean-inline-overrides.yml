name: Clean inline overrides
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-inline-overrides.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/clean_inline_overrides.py
      - run: |
          ! grep -q '<style>' index.html
          grep -q "@font-face" style.css
          ! grep -q 'filter:none!important' index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git commit -m "Clean inline overrides"
          git push origin HEAD:main
