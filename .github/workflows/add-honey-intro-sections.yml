name: Add honey intro sections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-honey-intro-sections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_honey_intro_sections.py
      - run: node --check app.js
      - run: grep -q 'section--honey-intro' index.html && grep -q 'section--honey-story' index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git commit -m "Add honey intro sections"
          git push origin HEAD:main
