name: Fix coffee scroll architecture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-coffee-scroll-architecture.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_coffee_scroll_architecture.py
      - run: node --check app.js
      - run: grep -q "for(let i=0;i<3;i++)" app.js
      - run: grep -q "document.addEventListener('wheel',onCoffeeWheel" app.js
      - run: grep -q "giannosCoffeeIndex" app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix coffee section wheel scrolling"
          git push origin HEAD:main
