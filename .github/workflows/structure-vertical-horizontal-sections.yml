name: Structure vertical and horizontal sections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/structure-vertical-horizontal-sections.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/structure_vertical_horizontal_sections.py
      - run: node --check app.js
      - run: grep -q "coffee-horizontal-track" app.js
      - run: grep -q "coffee-horizontal-section" style.css
      - run: grep -q "for(let i=0;i<3;i++)" app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Separate coffees into horizontal full-screen sections"
          git push origin HEAD:main
