name: Remove View Details underline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-view-details-underline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/remove_view_details_underline.py
      - run: grep -q 'text-decoration:none' style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git commit -m "Remove underline from View Details links"
          git push origin HEAD:main
