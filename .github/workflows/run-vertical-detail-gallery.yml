name: Run vertical detail gallery patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-vertical-detail-gallery.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_vertical_detail_gallery.py
      - run: node --check app.js
      - run: |
          test -f "assets/product_images/giannos-brazil-roast/Giannos Brazil Roast/giannos-brazil-ground-back.png"
          test -f "assets/product_images/giannos-french-vanilla/Giannos French Vanilla/giannos-french-vanilla-ground-back.png"
          test -f "assets/product_images/giannos-colombian-roast/Giannos Colombian Roast/giannos-colombia-ground-back.png"
          test -f "assets/product_images/giannos-original-roast/Giannos Original Roast/giannos-original-ground-back.png"
          test -f "assets/product_images/giannos-hazelnut/Giannos Hazelnut/giannos-hazelnut-ground-back.png"
          test -f "assets/product_images/giannos-espresso-roast/Giannos Espresso Roast/giannos-espresso-whole-back.png"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Add vertical front and back product detail gallery"
          git push origin HEAD:main
