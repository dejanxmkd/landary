name: Install honey products
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-honey-products.yml'
permissions:
  contents: write
jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install honey assets and patch page
        run: python3 .github/scripts/install_honey_products.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check olive.js
          node --check honey.js
      - name: Asset checks
        run: |
          test -f assets/honey/oak-tree/giannos-oak-tree-honey-front.png
          test -f assets/honey/oak-tree/giannos-oak-tree-honey-back.png
          test -f assets/honey/wildflower/giannos-wildflower-honey-front.png
          test -f assets/honey/wildflower/giannos-wildflower-honey-back.png
          test ! -f Giannos_Honey_4K_Transparent.zip
      - name: Integration checks
        run: |
          grep -q 'id="honey-scroll"' index.html
          grep -q 'honey.css' index.html
          grep -q 'honey.js' index.html
          grep -q '__honeySnapStops' app.js
          grep -q '__honeyDetailOpen' app.js
          grep -q "const honeySection=document.getElementById('honey-scroll')" app.js
          grep -q 'Sold out' honey.js
          grep -q 'sold-out-badge' honey.css
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add honey product slider and assets"
          git push origin HEAD:main
