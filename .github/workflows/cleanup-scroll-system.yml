name: Cleanup scroll system
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-scroll-system.yml'
permissions:
  contents: write
jobs:
  cleanup-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python3 .github/scripts/cleanup_scroll_system.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check olive.js
          node --check honey.js
      - name: Legacy system removed
        run: |
          ! grep -R -E 'is-sequence|is-cinematic|is-entry-cinematic|snapToNearest|globalStops|__oliveSnapStops|__honeySnapStops' app.js style.css olive.css honey.css olive.js honey.js
          ! grep -q 'scrollTo({top:target' app.js
      - name: Scroll mapping tests
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const progress=(y,start,distance)=>Math.max(0,Math.min(1,(y-start)/distance));
          const cases=[['coffee',6,5000],['olive',2,1000],['honey',2,1000]];
          for(const [name,count,distance] of cases){
            const start=2000;
            assert.equal(progress(start,start,distance),0,`${name} first product`);
            assert.equal(progress(start+distance,start,distance),1,`${name} last product`);
            assert.equal(progress(start+distance/2,start,distance),.5,`${name} midpoint`);
            for(const y of [start,start+distance*.2,start+distance*.5,start+distance*.8,start+distance]){
              const forward=progress(y,start,distance);
              const reverse=progress(y,start,distance);
              assert.equal(forward,reverse,`${name} reverse consistency`);
              const exact=forward*(count-1);
              assert(exact>=0&&exact<=count-1,`${name} product index range`);
            }
          }
          console.log('scroll mapping tests passed');
          NODE
      - name: Micro motion assertions
        run: |
          grep -q -- '--micro-y' app.js
          grep -q -- '--micro-y' olive.js
          grep -q -- '--micro-y' honey.js
          grep -q 'section.is-visible .intro-copy' style.css
          grep -q 'transition:transform 520ms' style.css
          grep -q 'transition:transform 520ms' olive.css
          grep -q 'transition:transform 520ms' honey.css
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js olive.js honey.js style.css olive.css honey.css index.html
          git commit -m "Simplify scrolling to clean micro interactions"
          git push origin HEAD:main
