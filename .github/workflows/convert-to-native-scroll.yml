name: Convert to native section scroll
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-to-native-scroll.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/convert_to_native_scroll.py
      - run: node --check app.js
      - run: grep -q "native-scroll-track" app.js
      - run: grep -q "scroll-snap-type:y mandatory" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Use native full-page scrolling for all sections"
          git push origin HEAD:main
