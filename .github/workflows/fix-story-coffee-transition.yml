name: Fix story coffee transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-story-coffee-transition.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix transition timing and scroll handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app.js')
          s = p.read_text()

          s = s.replace(
              "function atStoryEnd(){return scrollY>=Math.max(main.offsetHeight-innerHeight-2,0)}",
              "function scrollProgress(){return clamp(scrollY/Math.max(main.offsetHeight-innerHeight,1))}function atCoffeeTrigger(){return scrollProgress()>=.68}"
          )

          s = s.replace(
              "function onWheel(e){if(detailOpen)return;const dir=gestureDirection(e);if(!dir)return;if(coffeeStarted){e.preventDefault();if(locked){pendingDir=dir;return}if(dir<0&&active===0){returnToStory();return}move(dir);return}if(!atStoryEnd()||dir<0)return;e.preventDefault();revealBrazil()}",
              "function onWheel(e){if(detailOpen)return;const dir=gestureDirection(e);if(!dir)return;if(coffeeStarted){e.preventDefault();if(locked){pendingDir=dir;return}if(dir<0&&active===0){returnToStory();return}move(dir);return}if(dir<0||!atCoffeeTrigger())return;e.preventDefault();revealBrazil()}"
          )

          s = s.replace(
              "if(!atStoryEnd())return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();revealBrazil()}",
              "if(!atCoffeeTrigger())return;if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();revealBrazil()}"
          )

          # Make the story-to-product handoff feel like one continuous movement.
          s = s.replace(
              "story.style.transform='translateY(-76px) scale(.985)'",
              "story.style.transform='translateY(-110px) scale(.97)'"
          )
          s = s.replace(
              "setTimeout(()=>{product.style.transform=`translate(calc(-50% + ${targetX}px),-50%) scale(1)`;productCopy.style.opacity='1';productCopy.style.filter='blur(0)';productCopy.style.transform=mobile?'translateY(0)':'translate(0,-50%)'},420)",
              "setTimeout(()=>{product.style.transform=`translate(calc(-50% + ${targetX}px),-50%) scale(1)`;productCopy.style.opacity='1';productCopy.style.filter='blur(0)';productCopy.style.transform=mobile?'translateY(0)':'translate(0,-50%)'},320)"
          )

          p.write_text(s)

          css = Path('style.css')
          c = css.read_text()
          c = c.replace('main{height:430svh}', 'main{height:300svh}')
          css.write_text(c)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Fix story to coffee transition timing"
          git push origin HEAD:main
