name: Refine single coffee format details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/single-grind-format.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update single-format product details
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          rm .github/workflows/single-grind-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html .github/workflows/single-grind-format.yml
          git commit -m "Show single coffee format as metadata"
          git push
