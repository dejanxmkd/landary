name: Refine single coffee format details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/single-grind-format.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update single-format product details
        run: |
          python3 -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(); s=s.replace(\"if(!grinds.length)return '';\",\"if(grinds.length<=1)return '';\",1); old='''<div><dt>Bag Size</dt><dd>${product.size}</dd></div></dl>'''; new='''<div><dt>Bag Size</dt><dd>${product.size}</dd></div>${Object.keys(product.images).length===1?`<div><dt>Format</dt><dd>${Object.keys(product.images)[0]}</dd></div>`:''}</dl>'''; assert old in s; p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); p.write_text(re.sub(r'app\\.js\\?v=\\d+','app.js?v=202608171156',s))"
          rm .github/workflows/single-grind-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html .github/workflows/single-grind-format.yml
          git commit -m "Show single coffee format as metadata"
          git push
