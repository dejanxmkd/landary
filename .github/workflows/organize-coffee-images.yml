name: Organize coffee images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/organize-coffee-images.yml'

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack and organize coffee images
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import zipfile, shutil, re

          products = {
              'Giannos Brazil Roast.zip': 'brazil',
              'Giannos French Vanilla.zip': 'french-vanilla',
              'Giannos Colombian Roast.zip': 'colombian',
              'Giannos Original Roast.zip': 'original',
              'Giannos Hazelnut.zip': 'hazelnut',
              'Giannos Espresso Roast.zip': 'espresso',
          }

          assets = Path('assets')
          assets.mkdir(exist_ok=True)

          for zip_name, slug in products.items():
              archive = Path(zip_name)
              if not archive.exists():
                  continue
              dest = assets / slug
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(archive) as zf:
                  for member in zf.infolist():
                      if member.is_dir():
                          continue
                      source_name = Path(member.filename).name
                      if source_name.startswith('.') or '__MACOSX' in member.filename:
                          continue
                      if Path(source_name).suffix.lower() not in {'.png', '.jpg', '.jpeg', '.webp'}:
                          continue
                      clean_name = source_name.replace(' ', '-').lower()
                      clean_name = re.sub(r'-+', '-', clean_name)
                      with zf.open(member) as src, open(dest / clean_name, 'wb') as out:
                          shutil.copyfileobj(src, out)
              archive.unlink()

          app = Path('app.js')
          text = app.read_text()
          for slug in products.values():
              text = text.replace(f'./assets/product_images/{slug}/', f'./assets/{slug}/')
          app.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = re.sub(r'app\.js\?v=\d+', 'app.js?v=202608171214', html)
          index.write_text(html)
          PY

          rm .github/workflows/organize-coffee-images.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize coffee images under assets by product"
          git push