name: Fix slider sync speed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-slider-sync-speed.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_slider_sync_speed.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check olive.js
      - name: Slider mapping tests
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          function progress(y,start,distance,vh){
            const gate=Math.min(120,Math.max(64,vh*.14));
            const activeStart=start+gate;
            const activeDistance=Math.max(distance-gate,1);
            return Math.max(0,Math.min(1,(y-activeStart)/activeDistance));
          }
          const start=2000,vh=900;
          const coffeeDistance=4500;
          const gate=Math.min(120,Math.max(64,vh*.14));
          assert.equal(progress(start,start,coffeeDistance,vh),0,'coffee must stay on first product before reveal');
          assert.equal(progress(start+gate-1,start,coffeeDistance,vh),0,'coffee must not flash product 2 before reveal');
          assert.equal(progress(start+gate,start,coffeeDistance,vh),0,'coffee reveal must start at product 1');
          assert.equal(progress(start+coffeeDistance,start,coffeeDistance,vh),1,'coffee must end exactly on last product');
          const mid=start+gate+(coffeeDistance-gate)/2;
          assert(Math.abs(progress(mid,start,coffeeDistance,vh)-.5)<1e-9,'coffee midpoint mapping');
          // Reverse uses the same position-only function: identical y must yield identical product state.
          [start,start+gate,mid,start+coffeeDistance].forEach(y=>assert.equal(progress(y,start,coffeeDistance,vh),progress(y,start,coffeeDistance,vh)));
          const oliveDistance=900;
          assert.equal(progress(start,start,oliveDistance,vh),0,'olive must stay on first product before reveal');
          assert.equal(progress(start+gate,start,oliveDistance,vh),0,'olive reveal must start at product 1');
          assert.equal(progress(start+oliveDistance,start,oliveDistance,vh),1,'olive must end exactly on product 2');
          console.log('slider mapping tests passed');
          NODE
      - name: Integration assertions
        run: |
          grep -q 'const activeStart=start+gate' app.js
          grep -q 'const coffeeStart=start+gate' app.js
          grep -q 'snapTimer=setTimeout(snapToNearest,80)' app.js
          grep -q 'const activeStart=start+gate' olive.js
          grep -q 'return\[{y:activeStart},{y:activeStart+activeDistance}\]' olive.js
          grep -q 'opacity 420ms' style.css
          grep -q 'opacity 420ms' olive.css
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js olive.js style.css olive.css index.html
          git commit -m "Synchronize and speed up product sliders"
          git push origin HEAD:main
