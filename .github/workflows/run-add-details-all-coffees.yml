name: Run coffee details patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-add-details-all-coffees.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add_details_all_coffees.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js
          git commit -m "Add View Details to all coffee products"
          git push origin HEAD:main
# retry 3
