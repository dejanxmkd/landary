name: Reduce product images 20 percent
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reduce-product-images-20.yml'
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/reduce_product_images_20.py
      - name: Verify sizing rules
        run: |
          grep -q '28.8vw,432px' style.css
          grep -q '62.4%' olive.css
          grep -q '60.8%' honey.css
          grep -q '57.6%' olive.css
          grep -q '57.6%' honey.css
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css olive.css honey.css index.html
          git commit -m "Reduce normal product images by 20 percent"
          git push origin HEAD:main
