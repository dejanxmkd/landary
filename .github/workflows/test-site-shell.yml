name: Test site shell
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-site-shell.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax
        run: node --check site-shell.js
      - name: Shell integration
        run: |
          test -f assets/brand/giannos-logo.svg
          grep -q 'FREE SHIPPING ON ALL ORDERS OVER $50' index.html
          grep -q 'data-loader-counter' index.html
          grep -q 'data-nav-logo' index.html
          grep -q 'site-shell.css' index.html
          grep -q 'site-shell.js' index.html
          grep -q 'OLIVE OIL' index.html
          grep -q 'SUBSCRIPTIONS' index.html
          grep -q 'site-loader__counter' site-shell.css
          grep -q 'countDuration=reduced?450:3000' site-shell.js
          grep -q 'moveDuration=reduced?220:650' site-shell.js
