name: Restore TAY Rosemary font
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-tay-rosemary.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore font from repository history
        run: |
          mkdir -p assets/fonts
          curl -L --fail -o assets/fonts/TAYRosemary.woff2 https://raw.githubusercontent.com/dejanxmkd/landary/b70fcbf1245c0eeace113117c4668e4a84bac0e8/assets/fonts/TAYRosemary.woff2
          test -s assets/fonts/TAYRosemary.woff2
      - name: Commit restored font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/TAYRosemary.woff2
          git commit -m "Restore TAY Rosemary brand font"
          git push origin HEAD:main
