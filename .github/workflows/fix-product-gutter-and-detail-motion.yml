name: Fix product gutter and detail motion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-product-gutter-and-detail-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_product_gutter_and_detail_motion.py
      - run: node --check app.js
      - run: node --check olive.js
      - run: grep -q 'column-gap:clamp(32px,3vw,56px)' style.css && grep -q 'column-gap:clamp(32px,3vw,56px)' olive.css
      - run: grep -q 'function animateCopyLayout' olive.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css olive.css olive.js index.html
          git commit -m "Add product gutter and align detail animations"
          git push origin HEAD:main
