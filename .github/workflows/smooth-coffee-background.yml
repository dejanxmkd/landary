name: Smooth coffee background
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smooth-coffee-background.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/smooth_coffee_background.py
      - run: node --check app.js
      - run: grep -q "coffeeSticky.style.backgroundColor" app.js
      - run: grep -q "background:transparent" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Blend coffee section background colors on scroll"
          git push origin HEAD:main
