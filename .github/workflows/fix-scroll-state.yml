name: Fix scroll handoff and refresh state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-scroll-state.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix scroll handoff and preserve state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()

          s=s.replace(
            "let pendingDir=0;",
            "let pendingDir=0;\nconst VIEW_STATE_KEY='landary-view-state-v1';\nlet restoringView=false;"
          )

          marker="function scrollProgress(){return clamp(scrollY/Math.max(main.offsetHeight-innerHeight,1))}\nfunction atCoffeeTrigger(){return scrollProgress()>=.68}"
          replacement="""function scrollProgress(){return clamp(scrollY/Math.max(main.offsetHeight-innerHeight,1))}
function atCoffeeTrigger(){return scrollProgress()>=.68}
function coffeeTriggerY(){return Math.max(main.offsetHeight-innerHeight,1)*.68}
function storyReturnY(){return Math.max(main.offsetHeight-innerHeight,1)*.62}
function saveViewState(){
  if(restoringView)return;
  try{sessionStorage.setItem(VIEW_STATE_KEY,JSON.stringify({scrollY,coffeeStarted,active,detailOpen}))}catch(e){}
}
function restoreViewState(){
  let state=null;
  try{state=JSON.parse(sessionStorage.getItem(VIEW_STATE_KEY)||'null')}catch(e){}
  if(!state)return false;
  restoringView=true;
  const y=Math.max(0,Number(state.scrollY)||0);
  scrollTo(0,y);
  if(state.coffeeStarted){
    coffeeStarted=true;locked=false;detailOpen=false;active=clamp(Number(state.active)||0,0,panels.length-1);pendingDir=0;
    story.style.opacity='0';story.style.filter='blur(18px)';story.style.transform='translateY(-110px) scale(.97)';
    renderSlider();
  }else{
    coffeeStarted=false;locked=false;active=0;detailOpen=false;pendingDir=0;
    introRender();
  }
  requestAnimationFrame(()=>{restoringView=false;saveViewState()});
  return true;
}"""
          if marker not in s:
            raise SystemExit('scroll marker not found')
          s=s.replace(marker,replacement)

          old="""function onWheel(e){
  if(detailOpen)return;
  if(coffeeStarted){
    e.preventDefault();
    const dir=gestureDirection(e);if(!dir)return;
    if(locked){pendingDir=dir;return}
    if(dir<0&&active===0){returnToStory();return}
    move(dir);return;
  }
  const dir=gestureDirection(e);if(!dir||dir<0||!atCoffeeTrigger())return;
  e.preventDefault();revealBrazil();
}"""
          new="""function onWheel(e){
  if(detailOpen)return;
  if(!coffeeStarted)return;
  e.preventDefault();
  const dir=gestureDirection(e);if(!dir)return;
  if(locked){pendingDir=dir;return}
  if(dir<0&&active===0){returnToStory();return}
  move(dir);
}"""
          if old not in s:
            raise SystemExit('onWheel block not found')
          s=s.replace(old,new)

          old="function onScroll(){if(ticking||coffeeStarted||detailOpen)return;ticking=true;requestAnimationFrame(()=>{introRender();ticking=false})}"
          new="""function onScroll(){
  if(restoringView||detailOpen)return;
  saveViewState();
  if(coffeeStarted)return;
  if(ticking)return;
  ticking=true;
  requestAnimationFrame(()=>{
    introRender();
    if(atCoffeeTrigger()&&!coffeeStarted&&!locked)revealBrazil();
    ticking=false;
  });
}"""
          if old not in s:
            raise SystemExit('onScroll line not found')
          s=s.replace(old,new)

          s=s.replace(
            "active=next;locked=true;renderSlider();setTimeout(unlockCoffee,LOCK);",
            "active=next;locked=true;renderSlider();saveViewState();setTimeout(unlockCoffee,LOCK);"
          )

          s=s.replace(
            "coffeeStarted=true;locked=true;active=0;pendingDir=0;applyCinematicTransitions();",
            "coffeeStarted=true;locked=true;active=0;pendingDir=0;applyCinematicTransitions();saveViewState();"
          )

          old_return="setTimeout(()=>{coffeeStarted=false;locked=false;story.style.transition='none';hero.style.transition='none';introRender()},LOCK);"
          new_return="setTimeout(()=>{coffeeStarted=false;locked=false;story.style.transition='none';hero.style.transition='none';scrollTo(0,storyReturnY());introRender();saveViewState()},LOCK);"
          if old_return not in s:
            raise SystemExit('return timeout not found')
          s=s.replace(old_return,new_return)

          old_init="loadImages();updatePurchase();introRender();positionScrollCue();document.fonts?.ready.then(positionScrollCue);"
          new_init="history.scrollRestoration='manual';loadImages();updatePurchase();positionScrollCue();if(!restoreViewState())introRender();document.fonts?.ready.then(positionScrollCue);"
          if old_init not in s:
            raise SystemExit('init line not found')
          s=s.replace(old_init,new_init)

          s=s.replace(
            "addEventListener('scroll',onScroll,{passive:true});",
            "addEventListener('scroll',onScroll,{passive:true});\naddEventListener('pagehide',saveViewState);\naddEventListener('beforeunload',saveViewState);"
          )

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix coffee scroll handoff and preserve view on refresh"
          git push origin HEAD:main
