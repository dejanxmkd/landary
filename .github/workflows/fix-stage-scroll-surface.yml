name: Fix stage scroll surface
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stage-scroll-surface.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_stage_scroll_surface.py
      - run: node --check app.js
      - run: grep -q "stage.addEventListener('wheel',onWheel" app.js
      - run: grep -q "width:100vw;height:100svh" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Use the full stage as the scroll interaction surface"
          git push origin HEAD:main
