name: Remove coffee cinematic transition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-coffee-cinematic.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/remove_coffee_cinematic.py
      - run: node --check app.js
      - run: |
          ! grep -q -- "--scene-blur" app.js
          ! grep -q -- "--scene-image-y" app.js
          ! grep -q -- "--scene-copy-y" app.js
          ! grep -q -- "--scene-opacity" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Simplify coffee product transitions"
          git push origin HEAD:main
