name: Vertical drives coffee horizontal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vertical-drives-coffee-horizontal.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/vertical_drives_coffee_horizontal.py
      - run: node --check app.js
      - run: grep -q "nextCoffee\*innerWidth" app.js
      - run: grep -q "panels.length+2" app.js
      - run: grep -q "overflow-x:hidden;overflow-y:hidden" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Drive horizontal coffee sections with vertical scrolling"
          git push origin HEAD:main
