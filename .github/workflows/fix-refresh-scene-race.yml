name: Fix refresh scene race
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-refresh-scene-race.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_refresh_scene_race.py
      - run: node --check app.js
      - run: grep -q "if(scene===0)showHero()" app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Prevent hero reveal after restored scroll position"
          git push origin HEAD:main
