name: Fix close center animation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-close-center.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_close_center.py
      - run: node --check app.js
      - run: grep -q "is-closing" style.css
      - run: grep -q "targetTop=(innerHeight-collapsedHeight)/2" app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Stop detail close animation at center"
          git push origin HEAD:main
