name: Polish product detail
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-product-detail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/polish_product_detail.py
      - run: node --check app.js
      - run: grep -q "data-image-track" app.js
      - run: grep -q "function finishClose" app.js
      - run: grep -q "image-track" style.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Polish product detail close and carousel"
          git push origin HEAD:main
