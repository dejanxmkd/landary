name: Install olive oil assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-olive-assets.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and organize assets
        run: |
          rm -rf /tmp/olive-assets
          mkdir -p /tmp/olive-assets assets/olive-oil/500ml assets/olive-oil/3l
          unzip -q Giannos_Olive_Oil_4K_Clean_Transparent.zip -d /tmp/olive-assets
          cp '/tmp/olive-assets/Giannos_Olive_Oil_4K_Clean_Transparent/Giannos Greek Extra Virgin Olive Oil 500ml Bottle/'*.png assets/olive-oil/500ml/
          cp '/tmp/olive-assets/Giannos_Olive_Oil_4K_Clean_Transparent/Giannos Greek Extra Virgin Olive Oil 3 Liter Tin/'*.png assets/olive-oil/3l/
          rm Giannos_Olive_Oil_4K_Clean_Transparent.zip
      - name: Use local olive images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('olive.js')
          s=p.read_text()
          old="""      images:[
        'https://www.giannos.com/cdn/shop/files/Giannos_Olive_Oil_Resized_-_Front.png?v=1777448601&width=1946',
        'https://www.giannos.com/cdn/shop/files/Giannos_Olive_Oil_Resized_-_Back.png?v=1777448601&width=1946'
      ]"""
          new="""      images:[
        './assets/olive-oil/500ml/giannos-greek-extra-virgin-olive-oil-500ml-front.png',
        './assets/olive-oil/500ml/giannos-greek-extra-virgin-olive-oil-500ml-back.png'
      ]"""
          if old not in s: raise SystemExit('500ml image block not found')
          s=s.replace(old,new,1)
          old="""      images:[
        'https://www.giannos.com/cdn/shop/files/olive-oil-3L-tin-front.jpg?v=1775600164&width=1946',
        'https://www.giannos.com/cdn/shop/files/olive-oil-3L-tin-angled.jpg?v=1775600169&width=1946'
      ]"""
          new="""      images:[
        './assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-front.png',
        './assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-front-angled.png',
        './assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-side.png',
        './assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-back.png'
      ]"""
          if old not in s: raise SystemExit('3L image block not found')
          s=s.replace(old,new,1)
          # Make swipe cycle across however many images the product has.
          s=s.replace("state[index].image=dx<0?1:0;image.src=OLIVE_PRODUCTS[index].images[state[index].image]", "const count=OLIVE_PRODUCTS[index].images.length;state[index].image=dx<0?(state[index].image+1)%count:(state[index].image-1+count)%count;image.src=OLIVE_PRODUCTS[index].images[state[index].image]", 1)
          p.write_text(s)
          idx=Path('index.html')
          h=idx.read_text().replace('olive.js?v=202608171206','olive.js?v=202608171228')
          idx.write_text(h)
          PY
      - name: Verify
        run: |
          node --check olive.js
          test -f assets/olive-oil/500ml/giannos-greek-extra-virgin-olive-oil-500ml-front.png
          test -f assets/olive-oil/500ml/giannos-greek-extra-virgin-olive-oil-500ml-back.png
          test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-front.png
          test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-front-angled.png
          test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-side.png
          test -f assets/olive-oil/3l/giannos-greek-extra-virgin-olive-oil-3-liter-back.png
          test ! -f Giannos_Olive_Oil_4K_Clean_Transparent.zip
          ! grep -q 'www.giannos.com/cdn' olive.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use local 4K olive oil product images"
          git push origin HEAD:main
