name: Match all coffee blocks to Brazil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/match-all-coffee-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match coffee product positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="function productTarget(index){if(innerWidth<=640)return 'translate(-50%,-62%) scale(.78)';return index===0?'translate(calc(-50% - 25vw),-50%) scale(1)':'translate(calc(-50% - 25vw),calc(-50% + 8vh)) scale(1)'}"
          new="function productTarget(){if(innerWidth<=640)return 'translate(-50%,-62%) scale(.78)';return 'translate(calc(-50% - 25vw),-50%) scale(1)'}"
          if old not in s:
              raise SystemExit('Expected productTarget rule not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Match all coffee blocks to Brazil positioning"
          git push origin HEAD:main
